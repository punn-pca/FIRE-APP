openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Firekeeper cognitive analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeQuestion
      tags: [analyze]
      summary: Analyze a question through the Firekeeper PCA pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result with structured PCA audit metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Invalid request
        "500":
          description: Analysis failure
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversationTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    MemoryItem:
      type: object
      properties:
        content: { type: string }
        layer: { type: string }
        source: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        retrieval_score: { type: number, minimum: 0, maximum: 1 }
      required: [content, layer, source, confidence]
    AnalyzeRequest:
      type: object
      properties:
        question: { type: string, minLength: 1 }
        tone: { type: string }
        deepReasoning: { type: boolean }
        personalContext: { type: string }
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryItem" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ConversationTurn" }
      required: [question]
    EvidenceItem:
      type: object
      properties:
        id: { type: string }
        source:
          type: string
          enum: [user_input, conversation_history, memory, knowledge_base]
        text: { type: string }
        relevance_score: { type: number }
        quality_score: { type: number }
        consistency_score: { type: number }
        composite_score: { type: number }
        basis:
          type: array
          items: { type: string }
      required: [id, source, text, relevance_score, quality_score, consistency_score, composite_score, basis]
    EvidenceReport:
      type: object
      properties:
        methodology: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/EvidenceItem" }
        aggregate_score: { type: number }
        coverage_score: { type: number }
      required: [methodology, items, aggregate_score, coverage_score]
    VerificationCheck:
      type: object
      properties:
        criterion: { type: string }
        rule: { type: string }
        passed: { type: boolean }
        evidence: { type: string }
        score: { type: number }
      required: [criterion, rule, passed, evidence, score]
    VerificationReport:
      type: object
      properties:
        status: { type: string, enum: [ผ่าน, ต้องตรวจสอบ] }
        consistency: { type: string, enum: [สอดคล้อง, ต้องทบทวน] }
        expected: { type: array, items: { type: string } }
        observed: { type: array, items: { type: string } }
        checks: { type: array, items: { type: string } }
        detailed_checks:
          type: array
          items: { $ref: "#/components/schemas/VerificationCheck" }
        score: { type: number }
      required: [status, consistency, expected, observed, checks, detailed_checks, score]
    ConfidenceReport:
      type: object
      properties:
        score: { type: number }
        band: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        method: { type: string }
        components:
          type: object
          additionalProperties: { type: number }
        verification_score: { type: number }
      required: [score, band, method, components, verification_score]
    ModuleAudit:
      type: object
      properties:
        module: { type: string }
        algorithm: { type: string }
        input_count: { type: number }
        score: { type: number }
        findings: { type: array, items: { type: string } }
        calculations:
          type: object
          additionalProperties: {}
        metrics:
          $ref: "#/components/schemas/ModuleRuntimeMetric"
      required: [module, algorithm, input_count, findings, calculations]
    ModuleRuntimeMetric:
      type: object
      properties:
        module: { type: string }
        duration_ms: { type: number }
        input_count: { type: number }
        output_count: { type: number }
        evidence_count: { type: number }
        hypothesis_count: { type: number }
        memory_hits: { type: number }
        missing_info_count: { type: number }
        conflict_count: { type: number }
      required: [module, duration_ms, input_count, output_count, evidence_count, hypothesis_count, memory_hits, missing_info_count, conflict_count]
    DataflowEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        outputs: { type: array, items: { type: string } }
        inputs: { type: array, items: { type: string } }
        transformation: { type: string }
        item_count: { type: number }
      required: [id, from, to, outputs, inputs, transformation, item_count]
    MemoryHit:
      type: object
      properties:
        rank: { type: number }
        content: { type: string }
        source: { type: string }
        retrieval_score: { type: number }
        matched_tokens: { type: array, items: { type: string } }
      required: [rank, content, source, retrieval_score, matched_tokens]
    MemoryRetrievalReport:
      type: object
      properties:
        query: { type: string }
        query_tokens: { type: array, items: { type: string } }
        algorithm: { type: string }
        threshold: { type: number }
        candidate_count: { type: number }
        matched_count: { type: number }
        hits: { type: array, items: { $ref: "#/components/schemas/MemoryHit" } }
        storage_backend: { type: string, enum: [postgres, file_fallback] }
        miss_reason: { type: string }
      required: [query, query_tokens, algorithm, threshold, candidate_count, matched_count, hits]
    ReasoningQualityMetrics:
      type: object
      properties:
        evidence_count: { type: number }
        evidence_coverage: { type: number }
        evidence_quality: { type: number }
        memory_hits: { type: number }
        hypothesis_count: { type: number }
        conflict_count: { type: number }
        missing_information_count: { type: number }
        unsupported_claim_count: { type: number }
        verification_pass_rate: { type: number }
        decision_margin: { type: number }
      required: [evidence_count, evidence_coverage, evidence_quality, memory_hits, hypothesis_count, conflict_count, missing_information_count, unsupported_claim_count, verification_pass_rate, decision_margin]
    LLMRuntime:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        request_ms: { type: number }
        retry_count: { type: number }
        prompt_tokens: { type: number }
        completion_tokens: { type: number }
        total_tokens: { type: number }
      required: [provider, model, request_ms, retry_count]
    CognitiveRuntime:
      type: object
      properties:
        total_ms: { type: number }
        pre_llm_ms: { type: number }
        post_llm_ms: { type: number }
        measured_stage_count: { type: number }
        phase_count: { type: number }
      required: [total_ms, pre_llm_ms, post_llm_ms, measured_stage_count, phase_count]
    RuntimeSummary:
      type: object
      properties:
        cognitive: { $ref: "#/components/schemas/CognitiveRuntime" }
        llm: { $ref: "#/components/schemas/LLMRuntime" }
      required: [cognitive, llm]
    DecisionOption:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        rationale: { type: string }
        criteria: { type: object, additionalProperties: { type: number } }
        weighted_score: { type: number }
        evidence_ids: { type: array, items: { type: string } }
      required: [id, label, rationale, criteria, weighted_score, evidence_ids]
    IntentRoute:
      type: object
      properties:
        type: { type: string, enum: [explanatory, decision, summary, comparison, general] }
        confidence: { type: number }
        rationale: { type: string }
        signals: { type: array, items: { type: string } }
        pipeline: { type: string, enum: [explanation, decision, summary, comparison, general] }
      required: [type, confidence, rationale, signals, pipeline]
    DecisionMatrix:
      type: object
      properties:
        methodology: { type: string }
        criteria_weights: { type: object, additionalProperties: { type: number } }
        options: { type: array, items: { $ref: "#/components/schemas/DecisionOption" } }
        selected_option: { type: string }
        selected_score: { type: number }
        selection_reason: { type: string }
      required: [methodology, criteria_weights, options, selected_option, selected_score, selection_reason]
    LogicalVerification:
      type: object
      properties:
        status: { type: string, enum: [ผ่าน, ต้องตรวจสอบ] }
        checks: { type: array, items: { $ref: "#/components/schemas/VerificationCheck" } }
        score: { type: number }
      required: [status, checks, score]
    ClaimNode:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        type: { type: string, enum: [fact, assumption, conclusion, unknown] }
        status: { type: string, enum: [supported, partial, unsupported] }
        source_module: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        assumption_ids: { type: array, items: { type: string } }
        conflict_ids: { type: array, items: { type: string } }
        decision_option_id: { type: string }
        support_score: { type: number }
      required: [id, text, type, status, source_module, evidence_ids, assumption_ids, conflict_ids, support_score]
    ReasoningGraphEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        relation: { type: string, enum: [supports, assumes, contradicts, influences] }
        weight: { type: number }
        rationale: { type: string }
      required: [id, from, to, relation, weight, rationale]
    ReasoningGraph:
      type: object
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/ClaimNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/ReasoningGraphEdge" } }
        selected_option: { type: string }
        unsupported_claim_count: { type: number }
        methodology: { type: string }
      required: [claims, edges, selected_option, unsupported_claim_count, methodology]
    StateTransition:
      type: object
      properties:
        id: { type: string }
        module: { type: string }
        state_field: { type: string }
        before: {}
        after: {}
        trigger: { type: string }
        impact: { type: string }
      required: [id, module, state_field, before, after, trigger, impact]
    PCAState:
      type: object
      properties:
        user_input: { type: string }
        language: { type: string, enum: [th, en] }
        intent: { $ref: "#/components/schemas/IntentRoute" }
        understanding: { type: string }
        purpose: { type: string }
        decision: { type: string }
        confidence: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        conflicts: { type: array, items: { type: string } }
        conflict_findings: { type: array, items: { type: object, additionalProperties: true } }
        missing_info: { type: array, items: { type: string } }
        evidence_report: { $ref: "#/components/schemas/EvidenceReport" }
        confidence_report: { $ref: "#/components/schemas/ConfidenceReport" }
        module_audit:
          type: array
          items: { $ref: "#/components/schemas/ModuleAudit" }
        runtime_metrics:
          type: array
          items: { $ref: "#/components/schemas/ModuleRuntimeMetric" }
        dataflow:
          type: array
          items: { $ref: "#/components/schemas/DataflowEdge" }
        memory_retrieval: { $ref: "#/components/schemas/MemoryRetrievalReport" }
        decision_matrix: { $ref: "#/components/schemas/DecisionMatrix" }
        logical_verification: { $ref: "#/components/schemas/LogicalVerification" }
        reasoning_quality: { $ref: "#/components/schemas/ReasoningQualityMetrics" }
        runtime_summary: { $ref: "#/components/schemas/RuntimeSummary" }
        reasoning_graph: { $ref: "#/components/schemas/ReasoningGraph" }
        state_transitions: { type: array, items: { $ref: "#/components/schemas/StateTransition" } }
        verification: { $ref: "#/components/schemas/VerificationReport" }
        runtime_lifecycle: { type: array, items: { type: object, additionalProperties: true } }
        governance: { type: object, additionalProperties: true }
        knowledge_map: { type: object, additionalProperties: true }
        trace: { type: array, items: { type: object, additionalProperties: true } }
      required: [user_input, language, intent, understanding, purpose, decision, confidence, conflicts, conflict_findings, missing_info, evidence_report, confidence_report, module_audit, runtime_metrics, dataflow, memory_retrieval, decision_matrix, logical_verification, reasoning_quality, runtime_summary, reasoning_graph, state_transitions, verification]
    UserReport:
      type: object
      properties:
        answer: { type: string }
        route: { $ref: "#/components/schemas/IntentRoute" }
        confidence: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        limitations: { type: array, items: { type: string } }
        next_step: { type: string }
      required: [answer, route, confidence, limitations]
    AnalystReport:
      type: object
      properties:
        evidence_report: { $ref: "#/components/schemas/EvidenceReport" }
        knowledge_map: { type: object, additionalProperties: true }
        missing_info: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: object, additionalProperties: true } }
        confidence_report: { $ref: "#/components/schemas/ConfidenceReport" }
        verification: { $ref: "#/components/schemas/VerificationReport" }
        logical_verification: { $ref: "#/components/schemas/LogicalVerification" }
        reasoning_quality: { $ref: "#/components/schemas/ReasoningQualityMetrics" }
        decision_matrix: { $ref: "#/components/schemas/DecisionMatrix" }
      required: [evidence_report, knowledge_map, missing_info, conflicts, confidence_report, verification, logical_verification, reasoning_quality]
    DeveloperTrace:
      type: object
      properties:
        notes: { type: array, items: { type: string } }
        runtime_summary: { $ref: "#/components/schemas/RuntimeSummary" }
        runtime_lifecycle: { type: array, items: { type: object, additionalProperties: true } }
        trace: { type: array, items: { type: object, additionalProperties: true } }
        dataflow: { type: array, items: { $ref: "#/components/schemas/DataflowEdge" } }
        runtime_metrics: { type: array, items: { $ref: "#/components/schemas/ModuleRuntimeMetric" } }
        module_audit: { type: array, items: { $ref: "#/components/schemas/ModuleAudit" } }
        state_transitions: { type: array, items: { $ref: "#/components/schemas/StateTransition" } }
        reasoning_graph: { $ref: "#/components/schemas/ReasoningGraph" }
      required: [notes, runtime_summary, runtime_lifecycle, trace, dataflow, runtime_metrics, module_audit, state_transitions, reasoning_graph]
    ReportLayers:
      type: object
      properties:
        user_report: { $ref: "#/components/schemas/UserReport" }
        analyst_report: { $ref: "#/components/schemas/AnalystReport" }
        developer_trace: { $ref: "#/components/schemas/DeveloperTrace" }
      required: [user_report, analyst_report, developer_trace]
    AnalyzeResponse:
      type: object
      properties:
        response: { type: string }
        reports: { $ref: "#/components/schemas/ReportLayers" }
        pcaState: { $ref: "#/components/schemas/PCAState" }
      required: [response, reports, pcaState]

