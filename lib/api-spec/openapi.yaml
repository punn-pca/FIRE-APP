openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: FIRE Framework cognitive analysis
  - name: research
    description: Reproducible FIRE research evaluation suite
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeQuestion
      tags: [analyze]
      summary: Analyze a question through the FIRE Framework pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result with structured PCA audit metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Invalid request
        "500":
          description: Analysis failure
  /analyze/research-suite:
    post:
      operationId: runResearchSuite
      tags: [research]
      summary: Run the reproducible FIRE benchmark and stress-test suite
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchSuiteRequest"
      responses:
        "200":
          description: Benchmark results with before/after metrics and stress tests
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: "#/components/schemas/ResearchSuiteEvaluation"
                required: [evaluation]
        "400":
          description: Invalid research suite request
        "500":
          description: Research suite failure
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversationTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    MemoryItem:
      type: object
      properties:
        content: { type: string }
        layer: { type: string }
        source: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        retrieval_score: { type: number, minimum: 0, maximum: 1 }
      required: [content, layer, source, confidence]
    AnalyzeRequest:
      type: object
      properties:
        question: { type: string, minLength: 1 }
        tone: { type: string }
        deepReasoning: { type: boolean }
        personalContext: { type: string }
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryItem" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ConversationTurn" }
      required: [question]
    EvidenceItem:
      type: object
      properties:
        id: { type: string }
        source:
          type: string
          enum: [user_input, conversation_history, memory, knowledge_base]
        text: { type: string }
        relevance_score: { type: number }
        quality_score: { type: number }
        consistency_score: { type: number }
        composite_score: { type: number }
        basis:
          type: array
          items: { type: string }
      required: [id, source, text, relevance_score, quality_score, consistency_score, composite_score, basis]
    EvidenceReport:
      type: object
      properties:
        methodology: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/EvidenceItem" }
        aggregate_score: { type: number }
        coverage_score: { type: number }
        source_coverage:
          type: object
          additionalProperties: { type: number }
        source_diversity_score: { type: number }
        supported_source_count: { type: number }
      required: [methodology, items, aggregate_score, coverage_score, source_coverage, source_diversity_score, supported_source_count]
    VerificationCheck:
      type: object
      properties:
        criterion: { type: string }
        rule: { type: string }
        passed: { type: boolean }
        evidence: { type: string }
        score: { type: number }
      required: [criterion, rule, passed, evidence, score]
    VerificationReport:
      type: object
      properties:
        status: { type: string, enum: [ผ่าน, ต้องตรวจสอบ] }
        consistency: { type: string, enum: [สอดคล้อง, ต้องทบทวน] }
        expected: { type: array, items: { type: string } }
        observed: { type: array, items: { type: string } }
        checks: { type: array, items: { type: string } }
        detailed_checks:
          type: array
          items: { $ref: "#/components/schemas/VerificationCheck" }
        score: { type: number }
      required: [status, consistency, expected, observed, checks, detailed_checks, score]
    ConfidenceReport:
      type: object
      properties:
        score: { type: number }
        band: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        method: { type: string }
        components:
          type: object
          additionalProperties: { type: number }
        verification_score: { type: number }
      required: [score, band, method, components, verification_score]
    ModuleAudit:
      type: object
      properties:
        module: { type: string }
        algorithm: { type: string }
        input_count: { type: number }
        score: { type: number }
        findings: { type: array, items: { type: string } }
        calculations:
          type: object
          additionalProperties: {}
        metrics:
          $ref: "#/components/schemas/ModuleRuntimeMetric"
      required: [module, algorithm, input_count, findings, calculations]
    ModuleRuntimeMetric:
      type: object
      properties:
        module: { type: string }
        duration_ms: { type: number }
        input_count: { type: number }
        output_count: { type: number }
        evidence_count: { type: number }
        hypothesis_count: { type: number }
        memory_hits: { type: number }
        missing_info_count: { type: number }
        conflict_count: { type: number }
      required: [module, duration_ms, input_count, output_count, evidence_count, hypothesis_count, memory_hits, missing_info_count, conflict_count]
    DataflowEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        outputs: { type: array, items: { type: string } }
        inputs: { type: array, items: { type: string } }
        transformation: { type: string }
        item_count: { type: number }
      required: [id, from, to, outputs, inputs, transformation, item_count]
    MemoryHit:
      type: object
      properties:
        rank: { type: number }
        content: { type: string }
        source: { type: string }
        retrieval_score: { type: number }
        matched_tokens: { type: array, items: { type: string } }
      required: [rank, content, source, retrieval_score, matched_tokens]
    MemoryRetrievalReport:
      type: object
      properties:
        query: { type: string }
        query_tokens: { type: array, items: { type: string } }
        algorithm: { type: string }
        threshold: { type: number }
        candidate_count: { type: number }
        matched_count: { type: number }
        hits: { type: array, items: { $ref: "#/components/schemas/MemoryHit" } }
        storage_backend: { type: string, enum: [postgres, file_fallback] }
        miss_reason: { type: string }
      required: [query, query_tokens, algorithm, threshold, candidate_count, matched_count, hits]
    ReasoningQualityMetrics:
      type: object
      properties:
        evidence_count: { type: number }
        evidence_coverage: { type: number }
        evidence_quality: { type: number }
        memory_hits: { type: number }
        hypothesis_count: { type: number }
        conflict_count: { type: number }
        missing_information_count: { type: number }
        unsupported_claim_count: { type: number }
        verification_pass_rate: { type: number }
        decision_margin: { type: number }
      required: [evidence_count, evidence_coverage, evidence_quality, memory_hits, hypothesis_count, conflict_count, missing_information_count, unsupported_claim_count, verification_pass_rate, decision_margin]
    LLMRuntime:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        request_ms: { type: number }
        retry_count: { type: number }
        prompt_tokens: { type: number }
        completion_tokens: { type: number }
        total_tokens: { type: number }
      required: [provider, model, request_ms, retry_count]
    CognitiveRuntime:
      type: object
      properties:
        total_ms: { type: number }
        pre_llm_ms: { type: number }
        post_llm_ms: { type: number }
        measured_stage_count: { type: number }
        phase_count: { type: number }
      required: [total_ms, pre_llm_ms, post_llm_ms, measured_stage_count, phase_count]
    RuntimeSummary:
      type: object
      properties:
        cognitive: { $ref: "#/components/schemas/CognitiveRuntime" }
        llm: { $ref: "#/components/schemas/LLMRuntime" }
      required: [cognitive, llm]
    DecisionOption:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        rationale: { type: string }
        criteria: { type: object, additionalProperties: { type: number } }
        weighted_score: { type: number }
        evidence_ids: { type: array, items: { type: string } }
      required: [id, label, rationale, criteria, weighted_score, evidence_ids]
    IntentRoute:
      type: object
      properties:
        type: { type: string, enum: [explanatory, decision, summary, comparison, general] }
        confidence: { type: number }
        rationale: { type: string }
        signals: { type: array, items: { type: string } }
        pipeline: { type: string, enum: [explanation, decision, summary, comparison, general] }
      required: [type, confidence, rationale, signals, pipeline]
    DecisionMatrix:
      type: object
      properties:
        methodology: { type: string }
        criteria_weights: { type: object, additionalProperties: { type: number } }
        options: { type: array, items: { $ref: "#/components/schemas/DecisionOption" } }
        selected_option: { type: string }
        selected_score: { type: number }
        selection_reason: { type: string }
        counterfactual_analysis: { $ref: "#/components/schemas/CounterfactualAnalysis" }
        causal_reasoning: { $ref: "#/components/schemas/CausalReasoning" }
      required: [methodology, criteria_weights, options, selected_option, selected_score, selection_reason]
    CounterfactualComparison:
      type: object
      properties:
        option_id: { type: string }
        condition: { type: string }
        baseline_score: { type: number }
        counterfactual_score: { type: number }
        delta: { type: number }
        outcome: { type: string }
        evidence_ids: { type: array, items: { type: string } }
      required: [option_id, condition, baseline_score, counterfactual_score, delta, outcome, evidence_ids]
    CounterfactualAnalysis:
      type: object
      properties:
        methodology: { type: string }
        baseline_condition: { type: string }
        counterfactual_condition: { type: string }
        comparisons:
          type: array
          items: { $ref: "#/components/schemas/CounterfactualComparison" }
        most_robust_option: { type: string }
        sensitivity_score: { type: number }
      required: [methodology, baseline_condition, counterfactual_condition, comparisons, most_robust_option, sensitivity_score]
    CausalLink:
      type: object
      properties:
        id: { type: string }
        cause: { type: string }
        effect: { type: string }
        mechanism: { type: string }
        relation: { type: string, enum: [contributes_to, constrains, moderates] }
        evidence_ids: { type: array, items: { type: string } }
        confidence: { type: number }
      required: [id, cause, effect, mechanism, relation, evidence_ids, confidence]
    CausalReasoning:
      type: object
      properties:
        methodology: { type: string }
        links:
          type: array
          items: { $ref: "#/components/schemas/CausalLink" }
        confounders: { type: array, items: { type: string } }
        score: { type: number }
      required: [methodology, links, confounders, score]
    LogicalVerification:
      type: object
      properties:
        status: { type: string, enum: [ผ่าน, ต้องตรวจสอบ] }
        checks: { type: array, items: { $ref: "#/components/schemas/VerificationCheck" } }
        score: { type: number }
      required: [status, checks, score]
    ClaimNode:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        type: { type: string, enum: [fact, assumption, conclusion, unknown] }
        status: { type: string, enum: [supported, partial, unsupported] }
        source_module: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        assumption_ids: { type: array, items: { type: string } }
        conflict_ids: { type: array, items: { type: string } }
        decision_option_id: { type: string }
        support_score: { type: number }
      required: [id, text, type, status, source_module, evidence_ids, assumption_ids, conflict_ids, support_score]
    ReasoningGraphEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        relation: { type: string, enum: [supports, assumes, contradicts, influences] }
        weight: { type: number }
        rationale: { type: string }
      required: [id, from, to, relation, weight, rationale]
    ReasoningGraph:
      type: object
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/ClaimNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/ReasoningGraphEdge" } }
        selected_option: { type: string }
        unsupported_claim_count: { type: number }
        methodology: { type: string }
      required: [claims, edges, selected_option, unsupported_claim_count, methodology]
    StateTransition:
      type: object
      properties:
        id: { type: string }
        module: { type: string }
        state_field: { type: string }
        before: {}
        after: {}
        trigger: { type: string }
        impact: { type: string }
      required: [id, module, state_field, before, after, trigger, impact]
    PCAState:
      type: object
      properties:
        user_input: { type: string }
        language: { type: string, enum: [th, en] }
        intent: { $ref: "#/components/schemas/IntentRoute" }
        understanding: { type: string }
        purpose: { type: string }
        decision: { type: string }
        confidence: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        conflicts: { type: array, items: { type: string } }
        conflict_findings: { type: array, items: { type: object, additionalProperties: true } }
        missing_info: { type: array, items: { type: string } }
        evidence_report: { $ref: "#/components/schemas/EvidenceReport" }
        confidence_report: { $ref: "#/components/schemas/ConfidenceReport" }
        module_audit:
          type: array
          items: { $ref: "#/components/schemas/ModuleAudit" }
        runtime_metrics:
          type: array
          items: { $ref: "#/components/schemas/ModuleRuntimeMetric" }
        dataflow:
          type: array
          items: { $ref: "#/components/schemas/DataflowEdge" }
        memory_retrieval: { $ref: "#/components/schemas/MemoryRetrievalReport" }
        decision_matrix: { $ref: "#/components/schemas/DecisionMatrix" }
        counterfactual_analysis: { $ref: "#/components/schemas/CounterfactualAnalysis" }
        causal_reasoning: { $ref: "#/components/schemas/CausalReasoning" }
        logical_verification: { $ref: "#/components/schemas/LogicalVerification" }
        reasoning_quality: { $ref: "#/components/schemas/ReasoningQualityMetrics" }
        runtime_summary: { $ref: "#/components/schemas/RuntimeSummary" }
        reasoning_graph: { $ref: "#/components/schemas/ReasoningGraph" }
        state_transitions: { type: array, items: { $ref: "#/components/schemas/StateTransition" } }
        verification: { $ref: "#/components/schemas/VerificationReport" }
        runtime_lifecycle: { type: array, items: { type: object, additionalProperties: true } }
        governance: { type: object, additionalProperties: true }
        knowledge_map: { type: object, additionalProperties: true }
        trace: { type: array, items: { type: object, additionalProperties: true } }
      required: [user_input, language, intent, understanding, purpose, decision, confidence, conflicts, conflict_findings, missing_info, evidence_report, confidence_report, module_audit, runtime_metrics, dataflow, memory_retrieval, decision_matrix, logical_verification, reasoning_quality, runtime_summary, reasoning_graph, state_transitions, verification]
    UserReport:
      type: object
      properties:
        answer: { type: string }
        executive_summary: { type: string }
        route: { $ref: "#/components/schemas/IntentRoute" }
        confidence: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
        limitations: { type: array, items: { type: string } }
        next_step: { type: string }
      required: [answer, executive_summary, route, confidence, limitations]
    AnalystReport:
      type: object
      properties:
        evidence_report: { $ref: "#/components/schemas/EvidenceReport" }
        knowledge_map: { type: object, additionalProperties: true }
        missing_info: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: object, additionalProperties: true } }
        confidence_report: { $ref: "#/components/schemas/ConfidenceReport" }
        verification: { $ref: "#/components/schemas/VerificationReport" }
        logical_verification: { $ref: "#/components/schemas/LogicalVerification" }
        reasoning_quality: { $ref: "#/components/schemas/ReasoningQualityMetrics" }
        decision_matrix: { $ref: "#/components/schemas/DecisionMatrix" }
        counterfactual_analysis: { $ref: "#/components/schemas/CounterfactualAnalysis" }
        causal_reasoning: { $ref: "#/components/schemas/CausalReasoning" }
      required: [evidence_report, knowledge_map, missing_info, conflicts, confidence_report, verification, logical_verification, reasoning_quality]
    SystemTrace:
      type: object
      properties:
        notes: { type: array, items: { type: string } }
        runtime_summary: { $ref: "#/components/schemas/RuntimeSummary" }
        runtime_lifecycle: { type: array, items: { type: object, additionalProperties: true } }
        trace: { type: array, items: { type: object, additionalProperties: true } }
        dataflow: { type: array, items: { $ref: "#/components/schemas/DataflowEdge" } }
        runtime_metrics: { type: array, items: { $ref: "#/components/schemas/ModuleRuntimeMetric" } }
        module_audit: { type: array, items: { $ref: "#/components/schemas/ModuleAudit" } }
        state_transitions: { type: array, items: { $ref: "#/components/schemas/StateTransition" } }
        reasoning_graph: { $ref: "#/components/schemas/ReasoningGraph" }
      required: [notes, runtime_summary, runtime_lifecycle, trace, dataflow, runtime_metrics, module_audit, state_transitions, reasoning_graph]
    ReportLayers:
      type: object
      properties:
        user_report: { $ref: "#/components/schemas/UserReport" }
        analyst_report: { $ref: "#/components/schemas/AnalystReport" }
        system_trace: { $ref: "#/components/schemas/SystemTrace" }
        confidence_summary:
          type: object
          properties:
            score: { type: number }
            band: { type: string, enum: [สูง, ปานกลาง, ต่ำ, ไม่สามารถประเมินได้] }
          required: [score, band]
      required: [user_report, analyst_report, system_trace, confidence_summary]
    AnalyzeResponse:
      type: object
      properties:
        response: { type: string }
        reports: { $ref: "#/components/schemas/ReportLayers" }
        pcaState: { $ref: "#/components/schemas/PCAState" }
      required: [response, reports, pcaState]
    ResearchSuiteRequest:
      type: object
      properties:
        seed: { type: string }
        methods:
          type: array
          items:
            type: string
            enum: [baseline, fire]
        includeMethodComparisons: { type: boolean }
    ResearchConfusionMetrics:
      type: object
      properties:
        true_positive: { type: number }
        false_positive: { type: number }
        true_negative: { type: number }
        false_negative: { type: number }
        precision: { type: number }
        recall: { type: number }
        f1: { type: number }
      required: [true_positive, false_positive, true_negative, false_negative, precision, recall, f1]
    ResearchMethodMetrics:
      type: object
      properties:
        method: { type: string }
        case_count: { type: number }
        truth_accuracy: { type: number }
        verification: { $ref: "#/components/schemas/ResearchConfusionMetrics" }
        unsupported_claim_rate: { type: number }
        calibration_error: { type: number }
        decision_stability: { type: number }
        prompt_injection_resistance: { type: number }
        adversarial_robustness: { type: number }
        average_latency_ms: { type: number }
        verifier_agreement: { type: number }
      required: [method, case_count, truth_accuracy, verification, unsupported_claim_rate, calibration_error, decision_stability, prompt_injection_resistance, adversarial_robustness, average_latency_ms, verifier_agreement]
    ResearchMetricDelta:
      type: object
      description: Difference between FIRE and baseline.
      properties:
        case_count: { type: number }
        truth_accuracy: { type: number }
        verification: { $ref: "#/components/schemas/ResearchConfusionMetrics" }
        unsupported_claim_rate: { type: number }
        calibration_error: { type: number }
        decision_stability: { type: number }
        prompt_injection_resistance: { type: number }
        adversarial_robustness: { type: number }
        average_latency_ms: { type: number }
        verifier_agreement: { type: number }
      required: [case_count, truth_accuracy, verification, unsupported_claim_rate, calibration_error, decision_stability, prompt_injection_resistance, adversarial_robustness, average_latency_ms, verifier_agreement]
    ResearchBenchmarkResult:
      type: object
      properties:
        case_id: { type: string }
        category: { type: string }
        method: { type: string }
        answer: { type: string }
        claims: { type: array, items: { type: string } }
        unsupported_claims: { type: array, items: { type: string } }
        confidence: { type: number }
        selected_decision: { type: string }
        verification_predicted: { type: boolean }
        verification_expected: { type: boolean }
        truth_correct: { type: boolean }
        verifier:
          type: object
          properties:
            model: { type: string }
            decision: { type: string, enum: [supported, unsupported, uncertain] }
            unsupported_claims: { type: array, items: { type: string } }
            evidence_ids: { type: array, items: { type: string } }
            rationale: { type: string }
          required: [model, decision, unsupported_claims, evidence_ids, rationale]
        perturbation:
          type: object
          properties:
            selected_decision: { type: string }
            truth_correct: { type: boolean }
            stable: { type: boolean }
          required: [truth_correct, stable]
        latency_ms: { type: number }
      required: [case_id, category, method, answer, claims, unsupported_claims, confidence, verification_predicted, verification_expected, truth_correct, verifier, perturbation, latency_ms]
    ResearchStressResult:
      type: object
      properties:
        case_id: { type: string }
        scenario: { type: string }
        tags: { type: array, items: { type: string } }
        method_results:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              passed: { type: boolean }
              failure_modes: { type: array, items: { type: string } }
            required: [method, passed, failure_modes]
      required: [case_id, scenario, tags, method_results]
    ResearchSuiteEvaluation:
      type: object
      properties:
        id: { type: string }
        generated_at: { type: string }
        methodology:
          type: object
          properties:
            version: { type: string }
            dataset: { type: string }
            dataset_status: { type: string, enum: [synthetic_reproducible, external_adapter_required] }
            source: { type: string }
            seed: { type: string }
            cases: { type: number }
            repetitions: { type: number }
            generator_model: { type: string }
            verifier_model: { type: string }
            protocol: { type: array, items: { type: string } }
            limitations: { type: array, items: { type: string } }
          required: [version, dataset, dataset_status, source, seed, cases, repetitions, generator_model, verifier_model, protocol, limitations]
        before_after:
          type: object
          properties:
            baseline: { $ref: "#/components/schemas/ResearchMethodMetrics" }
            fire: { $ref: "#/components/schemas/ResearchMethodMetrics" }
            delta: { $ref: "#/components/schemas/ResearchMetricDelta" }
          required: [baseline, fire, delta]
        method_comparison:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              status: { type: string, enum: [not_run, run] }
              metrics: { $ref: "#/components/schemas/ResearchMethodMetrics" }
              notes: { type: string }
            required: [method, status, notes]
        results: { type: array, items: { $ref: "#/components/schemas/ResearchBenchmarkResult" } }
        stress_tests: { type: array, items: { $ref: "#/components/schemas/ResearchStressResult" } }
        external_benchmarks:
          type: array
          items:
            type: object
            properties:
