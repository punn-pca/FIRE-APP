kind = "mobile"
previewPath = "/"
title = "FIRE KEEPER"
version = "1.0.0"
id = "artifacts/fire-keeper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21604

[services.development]
run = "pnpm --filter @workspace/fire-keeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fire-keeper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fire-keeper", "run", "serve" ]

[services.env]
PORT = "21604"
BASE_PATH = "/"
